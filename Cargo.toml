[workspace]
resolver = "2"
members = [
    "crates/pact-core",
    "crates/pact-parser",
    "crates/pact-analysis",
    "crates/pact-compose",
    "crates/pact-store",
    "crates/pact-engine",
    "crates/pact-http",
    "crates/pact-cli",
    "crates/pact-mcp",
    "crates/pact-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
logos = "0.15"
proptest = "1"
petgraph = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "net", "signal"] }
async-trait = "0.1"
# D13：turso（BETA）仅承载可随时重建的派生索引；真相源为 JSONL。
turso = { version = "0.8.0-pre.7", default-features = false }
# D10：TokenId 采用 ULID（有序、唯一、可读）。
ulid = "1"
tempfile = "3"
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "client", "client-legacy", "service"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
toml = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.1", features = ["client", "schemars", "server", "transport-child-process", "transport-io"] }
schemars = "1"

[profile.release]
lto = true
