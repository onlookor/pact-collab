[workspace]
resolver = "2"
members = [
    "crates/pact-core",
    "crates/pact-parser",
    "crates/pact-analysis",
    "crates/pact-compose",
    "crates/pact-store-model",
    "crates/pact-store",
    "crates/pact-views",
    "crates/pact-engine",
    "crates/pact-engine-kernel",
    "crates/pact-wasm",
    "crates/pact-http",
    "crates/pact-cli",
    "crates/pact-mcp",
    "crates/pact-runtime",
    "crates/pact-cpn",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
logos = "0.15"
proptest = "1"
petgraph = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "net", "signal"] }
async-trait = "0.1"
# D13：turso（BETA）仅承载可随时重建的派生索引；真相源为 JSONL。
turso = { version = "0.8.0-pre.7", default-features = false }
# D10：TokenId 采用 ULID（有序、唯一、可读）。
ulid = "1"
tempfile = "3"
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "client", "client-legacy", "service"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
toml = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.1", features = ["client", "schemars", "server", "transport-child-process", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
# NFR6 v2：TLS、Ed25519 请求签名与 MCP OIDC。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "webpki-roots"] }
webpki-roots = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }
jsonwebtoken = "9"
# WASM 门面（P2）：仅 wasm32 目标启用，原生构建不编译该依赖。
wasm-bindgen = "0.2"

[profile.release]
lto = true

# WASM 分发专用：以体积优先；`cargo build --target wasm32-unknown-unknown --profile wasm-release`。
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
