# dsh-pact bundle：以受 PACT 治理的子类替换内置 agent-loop，并插入审计观察行。
# DSH 的 patch 只按 id 覆盖字段（name 仅作一致性校验），不能改写注册名；
# 因此先禁用原始 agent-loop 行，再插入使用同一 `agentLoop` 服务的替代行。
- id: agent-loop
  disabled: true
- insert:
    - id: pact-agent-loop
      name: '@pact/dsh-plugin/loop'
      config:
        agents: []
    - id: dsh-pact-observe
      name: '@pact/dsh-plugin'
      config: {}
