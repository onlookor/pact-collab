openapi: 3.1.0
info:
  title: PACT Reference Plane v1
  version: 1.0.0
  description: |
    ThingRef 的解析与描述接口。治理平面不读写 PACT Counter/Archive，也不校验 PACT
    的 read gate；参与者凭 PACT token 取得票面后调用本平面，两边权限都需满足。

    首版包含 resolve / describe / invoke / mutate。invoke 仅接受 `capability.sideEffect =
    read-only` 的卡片，结果必须物化为新的静态引用（`resultRef` + `resultDigest`）；mutate
    仅接受 `capability.sideEffect = mutating` 的卡片，经本地幂等台账保证「至多生效一次」，
    与 invoke 的 scope 和 ACL operation 完全分离。mutate 已于动态写阶段实现（FR37/D53）。
    治理侧不解释 PACT 语义：domain / type 只用于选择 profile 与 ACL。

    设计依据见 `docs/thingref-governance.md` §13.6–§13.8。
servers:
  - url: https://ref.example.com
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: healthz
      summary: 进程存活探针
      responses:
        "200": { description: alive }
  /readyz:
    get:
      security: []
      operationId: readyz
      summary: 就绪探针（配置、审计、JWKS）
      responses:
        "200": { description: ready }
        "503": { description: not ready }
  /v1/resolve:
    post:
      operationId: resolveReference
      summary: 解析 URI 票面并取得短时句柄或校验摘要
      description: |
        需要 scope `ref:resolve` 与匹配的对象 ACL。v1 只接受 URI；`∅`、Identifier
        与裸路径返回 400。`intent=read` 返回 `handle` 与 `expiresAt`；
        `intent=verify` 只做存在性与摘要校验，禁止返回 `handle`。
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveRequest" }
      responses:
        "200":
          description: resolved
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              description: 固定为 no-store
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resolution" }
        "400": { $ref: "#/components/responses/InvalidReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DigestMismatch" }
        "410": { $ref: "#/components/responses/Expired" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
  /v1/describe:
    post:
      operationId: describeReference
      summary: 返回 ContractCard 的消费者投影
      description: |
        需要 scope `ref:describe` 与匹配的对象 ACL。响应是白名单投影，不是整张
        ContractCard：不含 owner、parties、内部 endpoint、credentialSource，
        也不自动透出未来新增字段。
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DescribeRequest" }
      responses:
        "200":
          description: contract descriptor
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              description: 固定为 no-store
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractDescriptor" }
        "400": { $ref: "#/components/responses/InvalidReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
  /v1/invoke:
    post:
      operationId: invokeCapability
      summary: 调用只读能力并把结果物化为静态引用
      description: |
        需要 scope `ref:invoke` 与匹配的对象 ACL（operation `invoke`）。仅接受
        `capability.sideEffect = read-only` 的卡片；其余返回 403。`reference` 必须
        指向卡片声明的服务标识（`<server.id>/<tool-path>`）。上游成功时服务把结果
        内容寻址写入物化目录，返回 `resultRef`（`file://`）与 `resultDigest`
        （`sha256:`），随后可用 `/v1/resolve` 解析该引用并交给参与者
        seed/produce 产生 witness token。上游失败统一返回 502 `UpstreamFailure`，
        审计记 `status=failed`，不泄露上游细节。v1 不轮询、不重试。
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvokeRequest" }
      responses:
        "200":
          description: invoked and materialized
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              description: 固定为 no-store
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invocation" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
  /v1/mutate:
    post:
      operationId: mutateCapability
      summary: 调用写能力并经幂等台账返回确定结论
      description: |
        需要 scope `ref:mutate` 与匹配的对象 ACL（operation `mutate`）。仅接受
        `capability.sideEffect = mutating` 的卡片；只读卡片返回 403。`reference` 必须
        严格等于 `<server.id>/<tool.name>`，`operation` 必须等于 `tool.name`。请求必须
        携带 `idempotencyKey`：服务先写 `intent` 并 fsync 再调用上游，上游返回后写
        `result`；同键同摘要的重放返回 `replayed=true` 且不再调用上游，同键异摘要返回
        409 `IdempotencyConflict`，上次崩溃于上游窗口内返回 409 `IdempotencyInDoubt`。
        结果按 `capability.result.materialization` 物化为 `file://` 引用。v1 不自动重试、
        不轮询、不做 saga/自动补偿。契约与实现见 `docs/thingref-governance.md` §13.8。
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MutateRequest" }
      responses:
        "200":
          description: mutated or replayed
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
            Cache-Control:
              description: 固定为 no-store
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mutation" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC JWT 或受控静态令牌。主体取自验证后的 `sub`，请求体不接受 `actor`。
        端点 scope：`ref:resolve`（/v1/resolve）、`ref:describe`（/v1/describe）、
        `ref:invoke`（/v1/invoke）、`ref:mutate`（/v1/mutate）。`ref:invoke` 与
        `ref:mutate` 互不蕴含，只读授权不自动升级为写授权。
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: 可选相关 ID；缺省由服务生成并在响应头回显
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
  headers:
    TraceId:
      description: 本次请求的相关 ID
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
  responses:
    InvalidRequest:
      description: 请求字段缺失、格式非法或 idempotencyKey 不合规
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidReference:
      description: 引用为空、为 `∅`、是 Identifier、是裸路径或违反 URI profile
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 缺少或无法验证凭据
      headers:
        WWW-Authenticate:
          description: 固定为 `Bearer realm="pact-ref"`
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 凭据有效，但缺少端点 scope 或对象 ACL 未命中
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 引用未被注册，或制品已不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DigestMismatch:
      description: 实际摘要与 expectedDigest 不一致
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Expired:
      description: 句柄已过期
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RequestTooLarge:
      description: 请求体超过 64 KiB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: 仅接受 application/json
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: 内部错误或审计不可用
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamFailure:
      description: adapter 上游失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: 服务启动中或排空中
      headers:
        Retry-After:
          description: 建议重试秒数
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamTimeout:
      description: adapter 超时
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyConflict:
      description: |
        幂等冲突。`IdempotencyConflict` 表示同键不同请求摘要；
        `IdempotencyInDoubt` 表示同键上一次写已越过 intent 但结论未知（不自动重试）。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ResolveRequest:
      type: object
      additionalProperties: false
      required: [domain, type, reference, intent]
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        type:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        reference:
          type: string
          minLength: 1
          maxLength: 65536
          description: URI 票面；v1 不接受 Identifier 或 `∅`
        intent:
          type: string
          enum: [read, verify]
        expectedDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: 可选；与实际不一致返回 409 DigestMismatch
        pactTokenId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
          description: 可选，仅用于审计关联，永不用于授权
    Resolution:
      type: object
      additionalProperties: false
      required: [contractId, version, mediaType]
      properties:
        contractId: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        mediaType: { type: string, minLength: 1 }
        digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        expiresAt: { type: string, format: date-time }
        handle:
          type: string
          minLength: 1
          description: 不透明短时句柄；intent=read 时必需，intent=verify 时禁止出现
    DescribeRequest:
      type: object
      additionalProperties: false
      required: [domain, type, reference]
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        type:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        reference:
          type: string
          minLength: 1
          maxLength: 65536
          description: URI 票面；v1 不接受 Identifier 或 `∅`
    ContractDescriptor:
      type: object
      additionalProperties: false
      required: [contractId, version, mediaType, reference]
      description: |
        消费者投影白名单。未列出的 ContractCard 字段一律不出现；新增字段需显式改
        schema 与 `docs/thingref-governance.md` §13.6.6。
      properties:
        contractId: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        status:
          type: string
          enum: [draft, active, deprecated, retired]
        mediaType: { type: string, minLength: 1 }
        artifact:
          type: object
          additionalProperties: false
          required: [kind, mediaType, digestPolicy]
          properties:
            kind: { type: string, minLength: 1 }
            mediaType: { type: string, minLength: 1 }
            schema: { type: string, minLength: 1 }
            schemaDigest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            digestPolicy:
              type: string
              enum: [required-at-archive, optional, never]
        capability:
          type: object
          additionalProperties: false
          required: [kind, sideEffect]
          properties:
            kind: { type: string, minLength: 1 }
            sideEffect:
              type: string
              enum: [read-only, mutating]
            timeoutMs: { type: integer, minimum: 1 }
            tool:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
                version: { type: string, minLength: 1 }
        auth:
          type: object
          additionalProperties: false
          properties:
            audience: { type: string, minLength: 1 }
            scopes:
              type: array
              items: { type: string, minLength: 1 }
        reference:
          type: object
          additionalProperties: false
          required: [schemes]
          properties:
            schemes:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                pattern: "^[a-z][a-z0-9+.-]{0,31}$"
            uriPattern: { type: string, minLength: 1 }
            mutableAllowed: { type: boolean }
            pinning:
              type: object
              additionalProperties: false
              required: [requiredForArchive]
              properties:
                requiredForArchive: { type: boolean }
                accepted:
                  type: array
                  items: { type: string, minLength: 1 }
        lifecycle:
          type: object
          additionalProperties: false
          required: [retention, deletionPolicy]
          properties:
            retention:
              type: string
              pattern: "^(permanent|P(?=[0-9T])(?:[0-9]+Y)?(?:[0-9]+M)?(?:[0-9]+W)?(?:[0-9]+D)?(?:T(?=[0-9])(?:[0-9]+H)?(?:[0-9]+M)?(?:[0-9]+S)?)?)$"
            deletionPolicy:
              type: string
              enum: [retain, delete, tombstone-then-delete]
            tombstoneRef: { type: string, minLength: 1 }
        failure:
          type: object
          propertyNames: { minLength: 1 }
          additionalProperties: { type: string, minLength: 1 }
        verification:
          type: object
          additionalProperties: false
          properties:
            conformance:
              type: array
              items: { type: string, minLength: 1 }
            suite: { type: string, minLength: 1 }
        consumerScope: { type: string, minLength: 1 }
      oneOf:
        - required: [artifact]
          not: { required: [capability] }
        - required: [capability]
          not: { required: [artifact] }
    InvokeRequest:
      type: object
      additionalProperties: false
      required: [domain, type, reference, operation, idempotencyKey]
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        type:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        reference:
          type: string
          minLength: 1
          maxLength: 65536
          description: 必须指向卡片声明的服务标识：`<server.id>/<tool-path>`
        operation:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
          description: 能力侧操作名；不参与端点 scope 与 ACL 求值
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
          description: 调用方幂等键；缺省不重试，v1 由上游语义决定去重
        input:
          description: 传给 MCP 工具的参数对象；缺省按空对象处理
          type: object
          additionalProperties: true
    Invocation:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [succeeded]
        resultRef:
          type: string
          minLength: 1
          description: 物化结果的 `file://` 引用；可与 `/v1/resolve` 配合使用
        resultDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: 与 `resultRef` 一致的内容摘要
    MutateRequest:
      type: object
      additionalProperties: false
      required: [domain, type, reference, operation, idempotencyKey]
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        type:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
        reference:
          type: string
          minLength: 1
          maxLength: 65536
          description: 必须严格等于 `<server.id>/<tool.name>`
        operation:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000-\u001F\u007F]+$'
          description: 必须等于 `capability.tool.name`
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
          description: 必需；本地幂等台账去重，参与 `requestDigest`
        input:
          description: 传给 MCP 工具的参数对象；缺省按空对象处理，参与 `requestDigest`
          type: object
          additionalProperties: true
        pactTokenId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
          description: 可选，仅用于审计关联，永不用于授权
    Mutation:
      type: object
      additionalProperties: false
      required: [status, replayed]
      properties:
        status:
          type: string
          enum: [succeeded]
        resultRef:
          type: string
          minLength: 1
          description: 物化结果的 `file://` 引用；`materialization=optional` 时可缺省
        resultDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: 与 `resultRef` 一致的内容摘要
        replayed:
          type: boolean
          description: true 表示结论来自幂等台账重放，上游未被再次调用
    Error:
      type: object
      additionalProperties: false
      required: [code, message, traceId, retryable]
      properties:
        code:
          type: string
          enum:
            - InvalidRequest
            - InvalidReference
            - Unauthorized
            - Forbidden
            - NotFound
            - MethodNotAllowed
            - DigestMismatch
            - Expired
            - RequestTooLarge
            - UnsupportedMediaType
            - RateLimited
            - Internal
            - AuditUnavailable
            - UpstreamFailure
            - Unavailable
            - UpstreamTimeout
            - IdempotencyConflict
            - IdempotencyInDoubt
            - JournalUnavailable
            - JournalFull
        message: { type: string, minLength: 1 }
        traceId:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        retryable: { type: boolean }
        detail:
          type: object
          additionalProperties: true
          description: 可选结构化上下文；不得包含正文、凭据、handle 或内部 URL
