# PACT CI：每次 push/PR 自动验证 build + 全量测试 + rustfmt + clippy + 依赖安全审计。
# 工具链与本地开发保持一致（stable，1.97+，edition 2021）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  check:
    name: build / test / fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust 工具链（stable + rustfmt + clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 依赖缓存
        uses: Swatinem/rust-cache@v2

      - name: 格式检查（rustfmt）
        run: cargo fmt --all -- --check

      - name: Lint（clippy，警告即失败）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 全量测试
        run: cargo test --workspace --locked

  audit:
    name: 依赖安全审计（cargo audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust 工具链（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo-audit CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-cli-${{ env.CARGO_AUDIT_VERSION }}

      - name: 安装 cargo-audit（版本固定）
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: 审计 Cargo.lock（漏洞即失败；unmaintained 仅告警）
        run: cargo audit --file Cargo.lock

  wasm:
    name: wasm32 构建 / ABI 与体积门禁 / Node 冒烟
    runs-on: ubuntu-latest
    env:
      WASM_BINDGEN_VERSION: 0.2.127
    steps:
      - uses: actions/checkout@v5

      - name: 准备 wasm 临时目录
        run: echo "PACT_WASM_PKG=${RUNNER_TEMP}/pact-wasm-pkg" >> "$GITHUB_ENV"

      - name: 安装 Rust 工具链（stable + wasm32-unknown-unknown）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 依赖缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 缓存 wasm-bindgen CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ env.WASM_BINDGEN_VERSION }}

      - name: 安装 wasm-bindgen CLI（版本须与 wasm-bindgen crate 一致）
        run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: wasm32 目标 Lint（clippy，警告即失败；仅 lib，不拉入原生 dev-deps）
        run: cargo clippy -p pact-wasm --target wasm32-unknown-unknown --locked -- -D warnings

      - name: 构建 wasm32 release 产物
        run: cargo build --locked -p pact-wasm --target wasm32-unknown-unknown --profile wasm-release

      - name: 生成 Node 绑定
        run: wasm-bindgen --target nodejs --out-dir "$PACT_WASM_PKG" target/wasm32-unknown-unknown/wasm-release/pact_wasm.wasm

      - name: ABI / 语义 / 体积门禁
        run: node crates/pact-wasm/js/ci-smoke.js

      - name: Node 持久化测试
        run: node --test crates/pact-wasm/js/test/*.test.js
