[package]
name = "pact-runtime"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "PACT 生产运行层：参与者驱动循环 + 多 agent 编排 + 外部副作用执行器（D24）"

[lib]
name = "pact_runtime"
path = "src/lib.rs"

[[bin]]
name = "pact-runtime"
path = "src/bin/pact-runtime.rs"

[dependencies]
pact-core = { path = "../pact-core" }
pact-engine = { path = "../pact-engine" }
pact-http = { path = "../pact-http" }
rmcp = { workspace = true }
tokio = { workspace = true, features = ["process"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
pact-store = { path = "../pact-store" }
