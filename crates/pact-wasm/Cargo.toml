[package]
name = "pact-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PACT WASM 本地分发形态（实验性）：无 IO 语义层 + 内存引擎 + JS 宿主存储"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pact-core = { path = "../pact-core" }
pact-parser = { path = "../pact-parser" }
pact-analysis = { path = "../pact-analysis" }
pact-compose = { path = "../pact-compose" }
pact-engine-kernel = { path = "../pact-engine-kernel" }
pact-store-model = { path = "../pact-store-model" }
pact-views = { path = "../pact-views" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

[dev-dependencies]
pact-engine = { path = "../pact-engine" }
pact-store = { path = "../pact-store" }
tokio = { workspace = true }
tempfile = { workspace = true }
